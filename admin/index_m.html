<html>

<head>

    <!-- Load ioBroker scripts and styles-->
    <link rel="stylesheet" type="text/css" href="../../css/adapter.css" />
    <link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css">

    <script type="text/javascript" src="../../lib/js/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="../../socket.io/socket.io.js"></script>

    <script type="text/javascript" src="../../js/translate.js"></script>
    <script type="text/javascript" src="../../lib/js/materialize.js"></script>
    <script type="text/javascript" src="../../js/adapter-settings.js"></script>

    <!-- Load our own files -->
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script type="text/javascript" src="words.js"></script>

    <script type="text/javascript">
        var accountSettingsInvalid = false;

        function addAccount(account, onChange) {
            var row = $('<div class="row account-row"></div>');
            [
                ['id', 'Account ID', 'text'],
                ['username', 'Username', 'text'],
                ['password', 'Password', 'password'],
                ['school', 'School', 'text'],
                ['baseUrl', 'School base URL', 'text']
            ].forEach(function (field) {
                var input = $('<input>').attr({
                    type: field[2], placeholder: field[1], 'aria-label': field[1],
                    autocomplete: field[0] === 'password' ? 'new-password' : 'off'
                }).addClass('account-' + field[0]).val(account[field[0]] || '');
                input.on('change keyup', function () { onChange(); });
                row.append($('<div class="col s12 m4 input-field"></div>').append(input));
            });
            var remove = $('<button type="button" class="btn-flat" title="Remove account" aria-label="Remove account"><i class="material-icons">delete</i></button>');
            remove.on('click', function () { row.remove(); onChange(); });
            row.append($('<div class="col s12 m2"></div>').append(remove));
            $('#accounts').append(row);
        }

        // This will be called by the admin adapter when the settings page loads
        function load(settings, onChange) {
            if (!settings) return;
            if (typeof supportsFeature !== 'function' || !supportsFeature('ADAPTER_AUTO_DECRYPT_NATIVE')) {
                if (typeof systemSecret !== 'undefined') {
                    _secret = systemSecret;
                } else {
                    _secret = (systemConfig && systemConfig.native && systemConfig.native.secret) || 'Zgfr56gFe87jJOM';
                }

                if (settings.client_secret) {
                    settings.client_secret = decrypt(_secret, settings.client_secret);
                }
                if (settings.accounts_json) {
                    settings.accounts_json = decrypt(_secret, settings.accounts_json);
                }
            }

            // example: select elements with id=key and class=value and insert value
            $('.value').each(function () {
                var $key = $(this);
                var id = $key.attr('id');
                if ($key.attr('type') === 'checkbox') {
                    // do not call onChange direct, because onChange could expect some arguments
                    $key.prop('checked', settings[id])
                        .on('change', () => onChange())
                        ;
                } else {
                    // do not call onChange direct, because onChange could expect some arguments
                    $key.val(settings[id])
                        .on('change', () => onChange())
                        .on('keyup', () => onChange())
                        ;
                }
            });
            $('#accounts').empty();
            accountSettingsInvalid = false;
            try {
                var accounts = settings.accounts_json ? JSON.parse(settings.accounts_json) : [];
                if (!Array.isArray(accounts)) throw new Error('Invalid accounts');
                accounts.forEach(function (account) { addAccount(account, onChange); });
            } catch (error) {
                accountSettingsInvalid = true;
                $('#account-error').show();
            }
            $('#add-account').off('click').on('click', function () { addAccount({}, onChange); onChange(); });
            onChange(false);
            // reinitialize all the Materialize labels on the page if you are dynamically adding inputs:
            if (M) M.updateTextFields();

            $(".controller-checkbox").change(function() {
                if ( $(this).prop("checked") == true ) {
                    $(".change-visibility").each(function() {
                        $(this).hide();
                    });
                    $(".change-anonym-visibility").each(function() {
                        $(this).show();
                    });
                } else {
                    $(".change-visibility").each(function() {
                        $(this).show();
                    });
                    $(".change-anonym-visibility").each(function() {
                        $(this).hide();
                    });
                }
            });

            if($(".controller-checkbox").prop("checked")){
                $(".change-visibility").each(function() {
                    $(this).hide();
                });
                $(".change-anonym-visibility").each(function() {
                    $(this).show();
                });
            } else {
                $(".change-visibility").each(function() {
                    $(this).show();
                });
                $(".change-anonym-visibility").each(function() {
                    $(this).hide();
                });
            }

        }

        // This will be called by the admin adapter when the user presses the save button
        function save(callback) {
            if (accountSettingsInvalid) {
                alert('Additional accounts could not be decoded. Settings were not saved.');
                return;
            }
            // example: select elements with class=value and build settings object
            var obj = {};
            $('.value').each(function () {
                var $this = $(this);
                if ($this.attr('type') === 'checkbox') {
                    obj[$this.attr('id')] = $this.prop('checked');
                } else if ($this.attr('type') === 'number') {
                    obj[$this.attr('id')] = parseFloat($this.val());
                } else {
                    //obj[$this.attr('id')] = $this.val();

                    var value = $this.val();
                    if (typeof supportsFeature !== 'function' || !supportsFeature('ADAPTER_AUTO_DECRYPT_NATIVE')) {
                        if ($this.attr('id') === 'client_secret') {
                            value = encrypt(_secret, value);
                        }
                    }
                    obj[$this.attr('id')] = value;


                }
            });
            var accounts = [];
            var invalid = false;
            var ids = ['primary'];
            $('.account-row').each(function () {
                var row = $(this);
                var account = {};
                ['id', 'username', 'password', 'school', 'baseUrl'].forEach(function (field) {
                    var value = row.find('.account-' + field).val();
                    account[field] = field === 'password' ? value : value.trim();
                });
                if (!/^[a-zA-Z0-9_-]+$/.test(account.id) || ids.indexOf(account.id) !== -1 ||
                    !account.username || !account.password || !account.school || !account.baseUrl) invalid = true;
                ids.push(account.id);
                accounts.push(account);
            });
            if (invalid) {
                alert('Complete every account field. IDs must be unique and contain only letters, numbers, underscores, or hyphens; primary is reserved.');
                return;
            }
            obj.accounts_json = accounts.length ? JSON.stringify(accounts) : '';
            if (obj.accounts_json && (typeof supportsFeature !== 'function' || !supportsFeature('ADAPTER_AUTO_DECRYPT_NATIVE'))) {
                obj.accounts_json = encrypt(_secret, obj.accounts_json);
            }
            callback(obj);
        }
    </script>

</head>

<body>

    <div class="m adapter-container">

        <div class="row">
            <div class="col s12 m4 l2">
                <img src="webuntis.png" class="logo">
            </div>
        </div>

        <div class="row">
            <div class="col s12 m12">
                <p class="translate title">Donate</p>
            </div>
            <div class="col s12 m2 center">
                <form action="https://www.paypal.com/donate" method="post" target="_top">
                    <input type="hidden" name="hosted_button_id" value="AAFQ3WMM46LT8" />
                    <input type="image" src="https://www.paypalobjects.com/en_US/DK/i/btn/btn_donateCC_LG.gif" border="0" name="submit" title="PayPal - The safer, easier way to pay online!" alt="Donate with PayPal button" />
                    <img alt="" border="0" src="https://www.paypal.com/en_DE/i/scr/pixel.gif" width="1" height="1" />
                </form>
            </div>
            <div class="col s10 m10" style="padding-top: 10px">
                <p class="translate">donate_desc</p> 
            </div>            
        </div>
		<div class="row">
			<div class="col s12">
				<h6 class="title translate">Anleitung WebUntis</h6>
			</div>
		</div>
		<div class="row">
			<div class="col s6">
                <p class="translate">
                    Für die richtigen Einstellungen nutzen See bitte die <a href="https://github.com/Newan/ioBroker.webuntis" target="_blank">Anleitung</a>
                </p>
            </div>
		</div>
        <div class="row">
			<div class="col s12">
				<h6 class="title translate">WebUntis settings</h6>
			</div>
		</div>
		<div class="row">
			<div class="col s6 input-field">
                <input type="checkbox" class="value controller-checkbox" id="anonymous" />
                <label for="anonymous" class="translate">Anonymous</label>
            </div>

            <div class="col s6 input-field change-anonym-visibility">
                <input type="text" class="value" id="class" />
                <label for="class" class="translate">Class name</label>
            </div>
		</div>

        <div class="row">
			<div class="col s6 input-field change-visibility">
                <input type="text" class="value " id="username" />
                <label for="username" class="translate">Username</label>
            </div>

            <div class="col s6 input-field change-visibility">
                <input type="password" class="value" id="client_secret" />
                <label for="client_secret" class="translate">Password</label>
            </div>
		</div>
		<div class="row">
			<div class="col s12">
				<h6 class="title translate">School settings</h6>
			</div>
		</div>
		<div class="row">
			<div class="col s6 input-field">
                <input type="text" class="value" id="school" />
                <label for="school" class="translate">School secret</label>
            </div>
			<div class="col s6 input-field">
                <input type="text" class="value" id="baseUrl" />
                <label for="baseUrl" class="translate">School base url</label>
            </div>
		</div>
        <div class="row">
            <div class="col s12"><h6>Additional accounts</h6></div>
            <div class="col s12" id="account-error" style="display:none">Additional accounts could not be decoded. Settings cannot be saved.</div>
        </div>
        <div id="accounts"></div>
        <div class="row"><div class="col s12">
            <button type="button" id="add-account" class="btn-flat" title="Add account" aria-label="Add account"><i class="material-icons">add</i></button>
        </div></div>
    </div>

</body>

</html>
